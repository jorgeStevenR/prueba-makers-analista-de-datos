name: prestamos_analytics
version: "1.0.0"
config-version: 2
profile: prestamos_analytics

model-paths: ["models"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  silver_path: "../lakehouse/silver_export"
  # Umbrales de exposición aprobada para segmentar clientes (regla de negocio configurable)
  umbral_exposicion_alta: 50000
  umbral_exposicion_media: 10000

models:
  prestamos_analytics:
    staging:
      +materialized: view
    gold:
      +materialized: table
